<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Competition Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <style>
        body {
            display: block;
            background-image: url(assets/bg2.jpg);
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 1em;
        }

        section {
            display: grid;
            place-content: center;
            flex-grow: 1;
        }

        h2 {
            backdrop-filter: blur(20px);
            border: 2px solid hsl(220, 30%, 70%);
            color: hsl(220, 30%, 90%);
            font-size: xx-large;
            font-family: "Audiowide";
            font-weight: 100;
            padding: 3em;
            border-radius: 0.7em;
            text-align: center;
            border-radius: 0.25em;
        }
        footer {
            width: 90%;
        }
        a {
            text-decoration: none;
            color: unset;
        }
        @media only screen and (max-width: 900px) {
            h2 {
                padding: 1em;
            }
            body {
                padding: 0;
            }
            footer {
                border-radius: 1em;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <section>
        <h2>Registration Successful</h2>
    </section>

    <footer>
        <div class="flexBox">
            <div class="location">
                <p>
                    <img class="indicator-icon" src="./assets/location.svg" alt="">
                    Mechatroics and Embedded System Lab
                </p>
                <p><span class="spaceBefore"></span>Department of EEE</p>
                <p><span class="spaceBefore"></span>Mymensingh Engineering College</p>
                <p><span class="spaceBefore"></span>Mymensingh</p>
            </div>
            <div class="vbar"></div>
            <div class="contact">
                <p>
                    <img class="indicator-icon pe-2" src="./assets/mail.svg" alt="">
                    meslmec2023@gmail.com
                </p>
                <a target="_blank" href="https://www.facebook.com/MESLMEC">
                    <p>
                        <img class="indicator-icon pe-2 s24" src="./assets/fb.svg" alt="">
                        facebook.com/MESLMEC
                    </p>
                </a>
            </div>
        </div>
    </footer>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</html>
